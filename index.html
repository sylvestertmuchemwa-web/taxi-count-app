<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f4ef">
  <title>Taxi Count — Local taxis, connected</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Taxi Count home"><span class="brand-icon">TC</span><span>Taxi<span class="brand-light">Count</span><small>LOCAL TAXIS. CONNECTED.</small></span></a>
      <div class="top-center"><span class="live-dot"></span><span id="networkLabel">LOCAL DEMO NETWORK</span></div>
      <div class="top-actions"><button class="icon-button" id="helpButton" aria-label="Help">?</button><div class="user-chip"><span class="user-avatar">T</span><span id="userLabel">Thandi M.</span></div></div>
    </header>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="side-label">YOUR APP</div>
        <button class="nav-item active" data-view="passenger"><span class="nav-symbol">⌖</span>Find a taxi</button>
        <button class="nav-item" data-view="driver"><span class="nav-symbol">▰</span>Driver desk</button>
        <button class="nav-item" data-view="history"><span class="nav-symbol">◷</span>Trip history</button>
        <div class="sidebar-bottom"><div class="support-card"><span class="support-icon">✳</span><strong>Built for the taxi route</strong><p>Helping passengers and local taxi operators stay connected.</p><button id="aboutButton">How Taxi Count works <span>↗</span></button></div><div class="version">TAXI COUNT <span>PROTOTYPE 0.1</span></div></div>
      </aside>
      <main id="mainContent"></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"><form method="dialog" class="modal-card"><button class="modal-close" aria-label="Close">×</button><div id="modalContent"></div><button class="button primary modal-ok">Got it</button></form></dialog>
  <script src="qr.js"></script>
  <script src="app.js"></script>
</body>
</html>
